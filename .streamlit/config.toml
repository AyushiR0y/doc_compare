[client]
# The app renders its own sidebar nav (st.page_link) so the pages get proper
# labels and icons instead of names derived from their filenames.
showSidebarNavigation = false
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#005eac"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f8fd"
textColor = "#0f172a"
font = "sans serif"

[server]
maxUploadSize = 200
